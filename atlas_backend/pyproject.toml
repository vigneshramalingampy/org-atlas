[project]
name = "atlas-backend"
version = "0.1.0"
description = "RAG based document upload and processing"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=0.42.0",
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.139.0",
    "httpx>=0.28.0",
    "loguru>=0.7.3",
    "lxml>=6.1.1",
    "mistune>=3.3.3",
    "openai>=1.60.0",
    "pdfplumber>=0.11.10",
    "pydantic-core>=2.46.4",
    "pydantic-settings>=2.14.2",
    "pymupdf>=1.28.0",
    "pymupdf4llm>=1.28.0",
    "pypdf>=6.14.2",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.18",
    "ruff>=0.15.20",
    "sentence-transformers>=3.3.1",
    "supabase>=2.15.0",
    "surrealdb>=0.4.2",
    "uvicorn>=0.50.2",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
]
